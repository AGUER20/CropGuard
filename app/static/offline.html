<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123524">
  <title>Offline · CropGuard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f8f4; color: #173b2a; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { width: min(90%, 32rem); text-align: center; }
    img { width: 4rem; height: 4rem; }
    h1 { margin: 1.25rem 0 .5rem; font-size: 2rem; }
    p { color: #496454; line-height: 1.6; }
    a { display: inline-block; margin-top: 1rem; padding: .7rem 1rem; border-radius: .35rem; background: #246b42; color: white; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/static/img/leaf-icon.svg" alt="CropGuard">
    <h1>You are offline</h1>
    <p>Connect to the internet to sign in, upload a leaf, or view your saved diagnoses.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
